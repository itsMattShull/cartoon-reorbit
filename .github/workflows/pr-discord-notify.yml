name: Discord PR Notify

on:
  pull_request:
    types: [opened, closed]
    branches: [dev, master]

jobs:
  notify:
    # Only same-repo PRs (fork PRs never receive secrets on `pull_request` anyway,
    # but skip explicitly rather than let the job fail silently). Only "opened" or an
    # actually-merged "closed" (a closed-without-merge PR gets no message).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    # Environment secrets let PR_WEBHOOK_URL/PR_WEBHOOK_SECRET resolve differently per
    # target branch without a dynamic secrets[] lookup, and let an "environment" be
    # given its own required-reviewer / allowed-branch protection rules in repo settings.
    # Create two GitHub Environments named "dev" and "production", each holding its own
    # PR_WEBHOOK_URL and PR_WEBHOOK_SECRET pointing at that deployment's webhook.
    environment: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'dev' }}
    steps:
      - name: Send Discord PR notification
        env:
          WEBHOOK_URL: ${{ secrets.PR_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.PR_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTION: ${{ github.event.action == 'closed' && 'merged' || 'opened' }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "No PR_WEBHOOK_URL/PR_WEBHOOK_SECRET configured for this environment — skipping."
            exit 0
          fi

          payload=$(jq -n \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg author "$PR_AUTHOR" \
            --arg action "$PR_ACTION" \
            '{action: $action, pr: {number: $number, title: $title, body: $body, author: $author}}')

          curl --fail --silent --show-error --max-time 10 --retry 2 \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"
