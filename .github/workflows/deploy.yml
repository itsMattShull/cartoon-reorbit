# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # CI gate: the deploy jobs below only run if this passes. On pull requests only this job runs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway Postgres + Redis so the real-database tests (tests/*.db.test.js) run instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The tests import the generated Prisma client; prisma.config.js needs DATABASE_URL to be set.
      - name: Generate Prisma client and migrate the test database
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      # Run on their own: they share one database, so they can't run alongside each other. They hold a
      # Redis connection open after finishing, hence --test-force-exit.
      - name: Real-database tests
        env:
          OG_BOARDS_TEST_DB: postgresql://ci:ci@localhost:5432/ci
          OG_TOURNAMENT_TEST_DB: postgresql://ci:ci@localhost:5432/ci
          OWNERSHIP_TEST_DB: postgresql://ci:ci@localhost:5432/ci
        run: node --test --test-force-exit --test-concurrency=1 tests/*.db.test.js

  deploy_production:
    needs: test
    if: ${{ github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -lc "
                set -eo pipefail

                # make Node/npm/npx/pm2 available
                export NVM_DIR=\"\$HOME/.nvm\"
                if [ -s \"\$NVM_DIR/nvm.sh\" ]; then
                  # nvm is incompatible with set -u; do NOT enable -u
                  . \"\$NVM_DIR/nvm.sh\"
                  nvm install 24 >/dev/null 2>&1 || true
                  nvm use 24 >/dev/null 2>&1 || true
                fi
                [ -s \"/usr/local/nvm/nvm.sh\" ] && . \"/usr/local/nvm/nvm.sh\" || true
                command -v node >/dev/null 2>&1 || export PATH=\"\$HOME/.local/bin:\$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:\$PATH\"

                cd /var/www/cartoon-reorbit
                git fetch origin master
                git reset --hard origin/master

                npm ci
                npx prisma migrate deploy
                npx prisma generate
                npm run build

          pm2 reload ecosystem.config.cjs --update-env
              "'
  deploy_development:
    needs: test
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write key and known_hosts (dev)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEV_SSH_PORT }}" "${{ secrets.DEV_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH (dev)
        run: |
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key -p "${{ secrets.DEV_SSH_PORT }}" \
            "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" bash -s <<'EOF'
          set -eo pipefail

          # Load nvm (user install or system install)
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          elif [ -s "/usr/local/nvm/nvm.sh" ]; then
            . "/usr/local/nvm/nvm.sh"
          fi

          if ! command -v nvm >/dev/null 2>&1; then
            echo "ERROR: nvm not found for user: $(whoami). Install nvm or use system Node."
            exit 1
          fi

          # Use a supported Node LTS (24.x; keep in sync with .nvmrc)
          nvm install 24 >/dev/null
          nvm use 24 >/dev/null

          cd /var/www/dev.cartoon-reorbit

          # Keep repo clean between deploys
          git fetch origin dev
          git reset --hard origin/dev

          rm -rf node_modules
          npm install --no-audit --no-fund

          npx prisma migrate deploy
          npx prisma generate
          npm run build

          # Graceful rolling reload (see production job for notes)
          pm2 reload ecosystem.config.cjs --update-env
          EOF
